<ul class="rule-list" aria-label="בקרות שמורות">
  @for (rule of rules(); track rule.id) {
    <li class="rule">
      <span class="rule-mark" aria-hidden="true">▤</span>
      <div class="rule-details">
        <h2>{{ rule.name }}</h2>
        <p>{{ rule.description || 'לא נוסף תיאור לבקרה זו.' }}</p>
      </div>
      <div class="entity-field">
        <span class="entity">{{ entityLabel(rule.rootEntityId) }}</span>
        <button
          type="button"
          [attr.aria-label]="'עריכה: ' + rule.name"
          (click)="editRule.emit(rule.id)"
        >
          עריכה
        </button>
        <button
          type="button"
          class="primary"
          [attr.aria-label]="'הרץ בקרה: ' + rule.name"
          (click)="runRule.emit(rule.id)"
        >
          הרץ בקרה
        </button>
      </div>
    </li>
  }
</ul>
