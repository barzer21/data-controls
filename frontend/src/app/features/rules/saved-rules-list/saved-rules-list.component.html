<ol class="rule-list" [attr.start]="startIndex() + 1" aria-label="בקרות שמורות">
  @for (rule of rules(); track rule.id; let index = $index) {
    <li class="rule">
      <span class="rule-mark" [attr.aria-label]="'בקרה מספר ' + (startIndex() + index + 1)"
        ><bdi>{{ startIndex() + index + 1 }}</bdi></span
      >
      <div class="rule-details">
        <div class="rule-title">
          <h2>{{ rule.name }}</h2>
          @if (rule.createdWithAi) {
            <span class="ai-origin" title="הבקרה נוצרה בעזרת AI; ייתכן שנערכה לאחר מכן"
              ><span aria-hidden="true">✦</span> נוצרה בעזרת AI</span
            >
          }
        </div>
        <p>{{ rule.description || 'לא נוסף תיאור לבקרה זו.' }}</p>
      </div>
      <div class="entity-field">
        <span class="entity">{{ entityLabel(rule.rootEntityId) }}</span>
        <button
          type="button"
          [attr.aria-label]="'עריכה: ' + rule.name"
          (click)="editRule.emit(rule.id)"
        >
          עריכה
        </button>
        <button
          type="button"
          class="primary"
          [attr.aria-label]="'הרץ בקרה: ' + rule.name"
          (click)="runRule.emit(rule.id)"
        >
          הרץ בקרה
        </button>
      </div>
    </li>
  }
</ol>
